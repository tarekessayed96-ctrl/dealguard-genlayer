<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DealGuard - GenLayer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap');
    body {
      font-family: Inter, sans-serif;
    }
  </style>
</head>
<body class="bg-[#070709] text-white min-h-screen">
  <div class="max-w-6xl mx-auto p-6">
    <!-- Header -->
    <header class="flex justify-between items-center mb-12">
      <div class="flex items-center gap-2">
        <div
          class="w-8 h-8 bg-white text-black rounded-lg grid place-items-center font-bold"
        >
          D
        </div>
        <span class="font-bold">
          DealGuard
        </span>
      </div>
      <span
        class="text-xs px-3 py-1 rounded-full bg-white/10 border border-white/10"
      >
        GenLayer Active
      </span>
    </header>
    <!-- Main -->
    <div class="grid md:grid-cols-2 gap-8">
      <!-- Hero -->
      <div>
        <h1
          class="text-5xl md:text-7xl font-extrabold leading-[0.9]"
        >
          Don't trust<br>
          the deal.<br>
          <span
            class="bg-clip-text text-transparent bg-gradient-to-r from-violet-300 to-emerald-300"
          >
            Verify it.
          </span>
        </h1>
        <p class="mt-6 text-white/50 max-w-lg">
          DealGuard reads and compares real web sources
          to verify online deals using GenLayer.
        </p>
        <div
          class="mt-8 text-xs text-white/30 max-w-md"
        >
          Every verification receives a unique case ID
          and is independently analyzed by GenLayer.
        </div>
      </div>
      <!-- Verification Form -->
      <div
        class="bg-white/5 border border-white/10 rounded-2xl p-6 space-y-4"
      >
        <input
          id="title"
          class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 outline-none text-sm"
          placeholder="Deal title"
          value="Samsung Refrigerator 300L - $99"
        >
        <textarea
          id="description"
          class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 outline-none h-28 text-sm"
          placeholder="Describe the deal..."
        >Brand new Samsung 300L refrigerator advertised for $99 with free shipping.</textarea>
        <input
          id="dealUrl"
          class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 outline-none text-sm font-mono"
          placeholder="Primary deal URL"
          value="https://www.samsung.com/us/refrigerators/"
        >
        <input
          id="secondUrl"
          class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 outline-none text-sm font-mono"
          placeholder="Second source URL"
          value="https://www.bestbuy.com/site/searchpage.jsp?st=samsung+refrigerator"
        >
        <button
          id="verifyBtn"
          onclick="verifyDeal()"
          class="w-full bg-white text-black p-4 rounded-xl font-bold transition hover:bg-white/90 disabled:opacity-50 disabled:cursor-not-allowed"
        >
          START VERIFICATION
        </button>
        <!-- Error -->
        <div
          id="error"
          class="hidden bg-red-500/10 border border-red-500/30 text-red-300 p-3 rounded-xl text-xs"
        ></div>
      </div>
    </div>
    <!-- Result -->
    <div
      id="result"
      class="hidden mt-8 bg-white/5 border border-white/10 rounded-2xl p-6"
    >
      <div class="flex justify-between items-center">
        <span
          id="verdict"
          class="px-3 py-1 rounded-full border text-xs font-bold"
        >
          -
        </span>
        <span
          id="score"
          class="text-4xl font-bold"
        >
          -
        </span>
      </div>
      <p
        id="confidence"
        class="mt-2 text-xs text-white/40"
      ></p>
      <p
        id="summary"
        class="mt-4 text-sm text-white/70 bg-black/40 p-4 rounded-xl"
      ></p>
      <h3 class="mt-6 font-bold">
        Reasons
      </h3>
      <ul
        id="reasons"
        class="mt-2 list-disc pl-5 text-sm text-white/60 space-y-2"
      ></ul>
      <h3 class="mt-6 font-bold">
        Evidence
      </h3>
      <ul
        id="evidence"
        class="mt-2 list-disc pl-5 text-sm text-white/60 space-y-2"
      ></ul>
      <div
        class="mt-6 bg-black/30 rounded-xl p-4"
      >
        <p class="text-[10px] text-white/30 mb-1">
          CASE ID
        </p>
        <p
          id="caseId"
          class="text-[10px] font-mono break-all text-white/50"
        ></p>
        <p class="text-[10px] text-white/30 mt-4 mb-1">
          TRANSACTION
        </p>
        <p
          id="txHash"
          class="text-[10px] font-mono break-all text-white/50"
        ></p>
      </div>
    </div>
  </div>
  <!-- Vite entry -->
  <script
    type="module"
    src="/app.js"
  ></script>
</body>
</html>
