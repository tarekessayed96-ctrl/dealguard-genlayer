<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealGuard - حماية الصفقات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #f5f7f4 0%, #e8ebe6 100%);
            min-height: 100vh;
            color: #2c3e2d;
        }
        
        .organic-blob {
            position: absolute;
            border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%;
            filter: blur(40px);
            opacity: 0.6;
            animation: morph 8s ease-in-out infinite;
        }
        
        .blob-1 {
            width: 400px; height: 400px;
            background: linear-gradient(135deg, #a8e6cf 0%, #7fcdbb 100%);
            top: -100px; right: -100px;
        }
        
        .blob-2 {
            width: 300px; height: 300px;
            background: linear-gradient(135deg, #dcedc1 0%, #c5e99b 100%);
            bottom: -50px; left: -50px;
            animation-delay: -2s;
        }
        
        @keyframes morph {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 50% 60% 30% 60% / 30% 60% 70% 40%; }
        }
        
        .organic-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(74, 124, 89, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }
        
        .nature-input {
            background: #fafbf9;
            border: 2px solid #e0e6dc;
            border-radius: 20px;
            transition: all 0.3s ease;
        }
        
        .nature-input:focus {
            outline: none;
            border-color: #7fcdbb;
            box-shadow: 0 0 0 4px rgba(127, 205, 187, 0.2);
        }
        
        .nature-btn {
            background: linear-gradient(135deg, #4a7c59 0%, #5a8c69 100%);
            color: white;
            border-radius: 25px;
            box-shadow: 0 8px 25px rgba(74, 124, 89, 0.3);
            transition: all 0.3s ease;
        }
        
        .nature-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 35px rgba(74, 124, 89, 0.4);
        }
        
        .organic-progress {
            height: 12px;
            background: #e8ebe6;
            border-radius: 20px;
            overflow: hidden;
        }
        
        .organic-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #7fcdbb 0%, #4a7c59 100%);
            border-radius: 20px;
            transition: width 0.5s ease;
        }
        
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f1f3f0; border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: #7fcdbb; border-radius: 5px; }
    </style>
</head>
<body class="relative overflow-x-hidden">
    <!-- Blobs -->
    <div class="organic-blob blob-1"></div>
    <div class="organic-blob blob-2"></div>

    <!-- Main -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4 md:p-8">
        
        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-green-100 text-green-700 text-sm mb-4">
                <span>🌳</span>
                <span>مدعوم من GenLayer</span>
            </div>
            
            <h1 class="text-5xl md:text-6xl font-bold text-green-800 mb-3">DealGuard</h1>
            
            <p class="text-xl text-green-600/70 max-w-lg mx-auto leading-relaxed">
                حماية طبيعية لصفقاتك عبر الذكاء الاصطناعي
            </p>
        </header>

        <!-- Main Card -->
        <main class="w-full max-w-3xl">
            <div class="organic-card p-8 md:p-10">
                
                <!-- Form -->
                <div class="space-y-6">
                    <div>
                        <label class="block text-green-800 font-bold mb-2">عنوان الصفقة</label>
                        <input type="text" id="title" class="nature-input w-full px-5 py-4 text-lg" placeholder="مثال: iPhone 15 Pro">
                    </div>

                    <div>
                        <label class="block text-green-800 font-bold mb-2">وصف الصفقة</label>
                        <textarea id="description" rows="3" class="nature-input w-full px-5 py-4 text-lg resize-none" placeholder="صف تفاصيل الصفقة..."></textarea>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-green-800 font-bold mb-2">رابط الموقع</label>
                            <input type="url" id="dealUrl" class="nature-input w-full px-5 py-4 text-lg" placeholder="https://example.com">
                        </div>
                        <div>
                            <label class="block text-green-800 font-bold mb-2">رابط المرجع</label>
                            <input type="url" id="secondUrl" class="nature-input w-full px-5 py-4 text-lg" placeholder="https://reviews.com">
                        </div>
                    </div>

                    <!-- Progress -->
                    <div id="status" class="hidden">
                        <div class="flex justify-between text-green-700 text-sm mb-2 font-bold">
                            <span id="progressText">...</span>
                            <span id="progressPercent">0%</span>
                        </div>
                        <div class="organic-progress">
                            <div id="progressBar" class="organic-progress-bar" style="width: 0%"></div>
                        </div>
                    </div>

                    <!-- Error -->
                    <div id="error" class="hidden p-4 rounded-2xl bg-red-100 text-red-700 text-center font-bold"></div>

                    <!-- Button -->
                    <button id="verifyBtn" class="nature-btn w-full py-4 text-lg font-bold flex items-center justify-center gap-3">
                        <span>🌿</span>
                        <span>تحقق من الصفقة</span>
                    </button>
                </div>
            </div>

            <!-- Result -->
            <div id="result" class="hidden mt-8"></div>
        </main>

        <!-- Footer -->
        <footer class="mt-12 text-center">
            <p class="text-green-600/60 text-sm">نحو صفقات أكثر أماناً مع GenLayer</p>
        </footer>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
