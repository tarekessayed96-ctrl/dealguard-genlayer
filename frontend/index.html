<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DealGuard</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white min-h-screen">
<div class="max-w-xl mx-auto p-6">
<h1 class="text-4xl font-black text-center mt-8">DealGuard</h1><p class="text-center text-white/40 text-xs mt-2">0x02E5...8041 V8 OKX</p>
<div class="mt-4 flex gap-2 justify-center">
<button onclick="location.href='https://explorer.genlayer.com/address/0x02E5c3bF44E7B055f07aFFd14502CadC38348041'" class="px-4 py-2 rounded-full bg-white text-black text-xs font-bold">View Contract</button>
</div>
<div id="err" class="hidden mt-4 bg-red-500/20 border border-red-500/40 text-red-200 p-3 rounded-xl text-xs"></div>
<div id="log" class="mt-4 bg-white/5 border border-white/10 p-3 rounded-xl text-[10px] font-mono text-white/50 hidden"></div>
<div class="mt-6 bg-white/[0.06] border border-white/10 rounded-[20px] p-6 space-y-4">
<input id="t" class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 outline-none" value="iPhone 15 Pro Max 256GB - $200">
<input id="u1" class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 outline-none" value="https://www.apple.com/iphone-15-pro/">
<input id="u2" class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 outline-none" value="https://www.gsmarena.com/apple_iphone_15_pro_max-12548.php">
<textarea id="d" class="w-full p-3.5 rounded-xl bg-black/50 border border-white/10 h-20 outline-none">Brand new sealed, half price, crypto only, urgent</textarea>
<button id="b" onclick="verifyDeal()" class="w-full bg-white text-black p-4 rounded-xl font-bold">START VERIFICATION</button>
</div>
<div id="r" class="hidden mt-6 bg-white/[0.06] border border-white/10 rounded-[20px] p-6">
<div class="flex justify-between"><span id="v" class="px-3 py-1 rounded-full border text-xs font-bold">-</span><span id="s" class="text-3xl font-black">-</span></div>
<p id="sum" class="mt-4 text-sm bg-black/40 p-3 rounded-xl"></p><ul id="rs" class="mt-2 list-disc pl-5 text-xs space-y-1"></ul><div id="tx" class="mt-3 text-[9px] font-mono break-all opacity-40"></div>
</div></div>
<script>
const CONTRACT="0x02E5c3bF44E7B055f07aFFd14502CadC38348041";
function showErr(m){const e=document.getElementById("err");e.classList.remove("hidden");e.innerText=m;}
async function verifyDeal(){
const b=document.getElementById("b");const t=document.getElementById("t").value;const u1=document.getElementById("u1").value;const u2=document.getElementById("u2").value;const d=document.getElementById("d").value;
document.getElementById("err").classList.add("hidden");
try{
const provider=window.okxwallet||window.ethereum;
if(!provider){showErr("Open inside OKX Wallet > Discover > Browser");return;}
b.disabled=true;b.innerText="Connecting...";
const accounts=await provider.request({method:"eth_requestAccounts"});const account=accounts[0];
let chainId=await provider.request({method:"eth_chainId"});
if(chainId.toLowerCase()!=="0xf22f"){
try{await provider.request({method:"wallet_switchEthereumChain",params:[{chainId:"0xf22f"}]})}catch(e){
if(e.code===4902){await provider.request({method:"wallet_addEthereumChain",params:[{chainId:"0xf22f",chainName:"GenLayer StudioNet",rpcUrls:["https://studio.genlayer.com/api/rpc"],nativeCurrency:{name:"GEN",symbol:"GEN",decimals:18}}])}else throw e;}}
const {createClient}=await import("https://esm.sh/genlayer-js@0.1.6");const {studionet}=await import("https://esm.sh/genlayer-js@0.1.6/chains");const {TransactionStatus}=await import("https://esm.sh/genlayer-js@0.1.6/types");
const client=createClient({chain:studionet,account:account,provider:provider});
b.innerText="Analyzing 30-60s...";
const hash=await client.writeContract({address:CONTRACT,functionName:"analyze_deal",args:[t,d,u1,u2],value:0n});
b.innerText="Waiting... "+hash.slice(0,10);
await client.waitForTransactionReceipt({hash:hash,status:TransactionStatus.ACCEPTED,interval:3000,retries:80});
await new Promise(r=>setTimeout(r,2000));
const json=await client.readContract({address:CONTRACT,functionName:"get_last_verification",args:[]});
const o=JSON.parse(json);
document.getElementById("r").classList.remove("hidden");
document.getElementById("s").innerText=(o.risk_score??0)+"/100";document.getElementById("v").innerText=o.verdict||"UNKNOWN";
document.getElementById("sum").innerText=o.summary||"";document.getElementById("rs").innerHTML=(o.reasons||[]).map(x=>"<li>"+x+"</li>").join("");
document.getElementById("tx").innerText=hash;b.innerText="Done ✓";
}catch(e){showErr("Error: "+(e.shortMessage||e.message||e));b.innerText="Try Again";b.disabled=false;}
}
</script></body></html>
